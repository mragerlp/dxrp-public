name: Discord commit log

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post commit to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not set — skipping."
            exit 0
          fi

          WEBHOOK=$(printf '%s' "$DISCORD_WEBHOOK_URL" | tr -d '\r\n')
          COMMIT_URL="https://github.com/${REPO}/commit/${COMMIT_SHA}"
          short_sha="${COMMIT_SHA:0:7}"

          if [ -n "$COMMIT_MESSAGE" ]; then
            first_line=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | cut -c1-500)
          else
            first_line="Manual workflow run by ${ACTOR}"
          fi

          if [ -n "$COMMIT_AUTHOR" ]; then
            author="$COMMIT_AUTHOR"
          else
            author="$ACTOR"
          fi

          payload=$(jq -n \
            --arg title "DXRP commit on ${REF_NAME}" \
            --arg url "$COMMIT_URL" \
            --arg desc "$first_line" \
            --arg author "$author" \
            --arg sha "$short_sha" \
            --arg repo "$REPO" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 5814783,
                fields: [
                  { name: "Author", value: $author, inline: true },
                  { name: "Commit", value: $sha, inline: true },
                  { name: "Repository", value: $repo, inline: false }
                ]
              }]
            }')

          http_code=$(curl -sS -o /tmp/discord-response.txt -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$WEBHOOK")

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Discord returned HTTP ${http_code}"
            cat /tmp/discord-response.txt
            exit 1
          fi

          echo "Posted to Discord (HTTP ${http_code})"
