name: Discord commit log

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  notify:
    if: github.event.head_commit != null
    runs-on: ubuntu-latest
    steps:
      - name: Post commit to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not set — skipping."
            exit 0
          fi

          short_sha="${COMMIT_SHA:0:7}"
          # First line only for embed description (Discord limit 4096; keep headroom)
          first_line=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | cut -c1-500)

          payload=$(jq -n \
            --arg title "DXRP commit on ${REF_NAME}" \
            --arg url "$COMMIT_URL" \
            --arg desc "$first_line" \
            --arg author "$COMMIT_AUTHOR" \
            --arg sha "$short_sha" \
            --arg link "$COMMIT_URL" \
            --arg repo "$REPO" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 5814783,
                fields: [
                  { name: "Author", value: $author, inline: true },
                  { name: "Commit", value: ("[`" + $sha + "`](`" + $link + "`)"), inline: true },
                  { name: "Repository", value: $repo, inline: false }
                ]
              }]
            }')

          curl -fsS -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
