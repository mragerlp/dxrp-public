name: Discord commit log

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post commit to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not set — skipping."
            exit 0
          fi

          WEBHOOK=$(printf '%s' "$DISCORD_WEBHOOK_URL" | tr -d '\r\n')
          if [ "${#WEBHOOK}" -lt 80 ]; then
            echo "DISCORD_WEBHOOK_URL looks invalid (too short after trim)."
            exit 1
          fi

          COMMIT_URL="https://github.com/${REPO}/commit/${COMMIT_SHA}"
          short_sha="${COMMIT_SHA:0:7}"

          if [ -n "${COMMIT_MESSAGE:-}" ]; then
            summary=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | cut -c1-400)
          else
            summary="Manual workflow run by ${ACTOR}"
          fi

          payload=$(jq -n \
            --arg content "**DXRP \`${REF_NAME}\`** · \`${short_sha}\`\n${summary}\n${COMMIT_URL}" \
            '{content: $content}')

          http_code=$(curl -sS -o /tmp/discord-response.txt -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$WEBHOOK")

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Discord returned HTTP ${http_code}"
            cat /tmp/discord-response.txt
            exit 1
          fi

          echo "Posted to Discord (HTTP ${http_code})"
